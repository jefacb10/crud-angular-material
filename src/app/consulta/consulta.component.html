<div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="10px">
  <div fxLayout="column" fxLayoutAlign="center center" fxFlex="50%">
    <form class="mt-60" #buscaForm="ngForm" (ngSubmit)="pesquisar(nomeBusca)">
      <mat-card appearance="outlined" class="w-100">
        <mat-card-header>
          <mat-card-title>Consulta</mat-card-title>
        </mat-card-header>
        <mat-card-content class="mt-20">
            <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="10px">
                <div fxLayout="column" fxLayoutAlign="center center" fxFlex="950px">
                    <mat-form-field appearance="outline" class="full-width">
                      <mat-label>Nome: </mat-label>
                      <input matInput type="text" name="nomeBusca" [(ngModel)]="nomeBusca" placeholder="Digite o nome do cliente para consulta" />
                    </mat-form-field>
                </div>
            </div>
        </mat-card-content>
        <mat-card-actions>
            <button mat-raised-button color="primary" type="submit">
                <mat-icon>search</mat-icon>
                Consultar
            </button>
        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
<div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="10px">
    <div fxLayout="column" fxLayoutAlign="center center" fxFlex="1000px">
        <mat-card appearance="outlined">
            <mat-card-header>
                <mat-card-title>Resultado da Consulta</mat-card-title>
            </mat-card-header>
            <mat-card-content class="mt-20">
                <table mat-table [dataSource]="listaClientes" class="mat-elevation-z8 w-100">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef> ID </th>
                        <td mat-cell *matCellDef="let cliente"> {{ cliente.id }} </td>
                    </ng-container>
                    <ng-container matColumnDef="nome">
                        <th mat-header-cell *matHeaderCellDef> Nome </th>
                        <td mat-cell *matCellDef="let cliente"> {{cliente.nome}} </td>
                    </ng-container>
                    <ng-container matColumnDef="cpf">
                        <th mat-header-cell *matHeaderCellDef> CPF </th>
                        <td mat-cell *matCellDef="let cliente"> {{cliente.cpf}} </td>
                    </ng-container>
                    <ng-container matColumnDef="dataNascimento">
                        <th mat-header-cell *matHeaderCellDef> Data de Nascimento </th>
                        <td mat-cell *matCellDef="let cliente"> {{ cliente.dataNascimento | date: 'dd/MM/yyyy' }} </td>
                    </ng-container>
                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef> Email </th>
                        <td mat-cell *matCellDef="let cliente"> {{cliente.email}} </td>
                    </ng-container>
                    <ng-container matColumnDef="acoes">
                        <th mat-header-cell *matHeaderCellDef> Ações </th>
                        <td mat-cell *matCellDef="let cliente">
                            <button mat-icon-button (click)="editar(cliente.id)">
                                <mat-icon>edit</mat-icon>
                            </button>

                            @if(!cliente.deletando){
                                <button mat-icon-button (click)="prepararExclusao(cliente)">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            }
                            @else{
                                <button mat-icon-button (click)="excluir(cliente)">
                                    <mat-icon>question_mark</mat-icon>
                                </button>
                            }
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="colunasTable"></tr>
                    <tr mat-row *matRowDef="let row; columns: colunasTable;"></tr>
                </table>
            </mat-card-content>
        </mat-card>
    </div>
</div>
