<div fxLayout="row" fxLayoutAlign="center center" class="consulta-container">
    <div fxFlex="1000px" fxLayout="column" fxLayoutAlign="center center" class="consulta-header">
        <form class="mt-60" #consultaForm="ngForm">
            <mat-card appearance="outlined" class="consulta-card">
              <mat-card-title>Consulta</mat-card-title>
              <mat-card-content class="mt-20">
                <div fxLayout="row">
                    <div fxLayout="column" fxFlex="950px">
                        <mat-form-field appearance="outline" class="consulta-input">
                          <mat-label>Nome</mat-label>
                          <input matInput placeholder="Ex.: José" name="nome" ngModel>
                        </mat-form-field>
                    </div>
                </div>
              </mat-card-content>
              <mat-card-actions class="mt-20">
                <button type="submit" mat-raised-button color="primary">
                    <mat-icon>search</mat-icon>
                    Pesquisar
                </button>
              </mat-card-actions>
            </mat-card>
            <div class="mat-elevation-z8">
              <table mat-table [dataSource]="dataSource">

                <!-- Position Column -->
                <ng-container matColumnDef="position">
                  <th mat-header-cell *matHeaderCellDef> No. </th>
                  <td mat-cell *matCellDef="let element"> {{element.position}} </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef> Name </th>
                  <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>

                <!-- Weight Column -->
                <ng-container matColumnDef="weight">
                  <th mat-header-cell *matHeaderCellDef> Weight </th>
                  <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
                </ng-container>

                <!-- Symbol Column -->
                <ng-container matColumnDef="symbol">
                  <th mat-header-cell *matHeaderCellDef> Symbol </th>
                  <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>

              <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                            showFirstLastButtons
                            aria-label="Select page of periodic elements">
              </mat-paginator>
            </div>
        </form>
    </div>
</div>
